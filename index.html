<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#173b32">
  <meta name="description" content="Solicitudes de elementos de izaje">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Solicitudes Izaje">
  <title>Solicitudes de Izaje</title>

  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icon.svg">

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #edf2ef;
      font-family: Arial, sans-serif;
      color: #20332b;
    }

    main {
      width: 100%;
      max-width: 420px;
      padding: 34px 25px;
      text-align: center;
      background: white;
      border-radius: 22px;
      box-shadow: 0 8px 30px #00000012;
    }

    img {
      width: 90px;
      height: 90px;
      margin-bottom: 18px;
    }

    h1 { font-size: 25px; margin: 0 0 8px; }
    .subtitulo { color: #64736b; margin-bottom: 28px; }

    a {
      display: block;
      padding: 17px;
      border-radius: 12px;
      background: #173b32;
      color: white;
      text-decoration: none;
      font-weight: bold;
      font-size: 17px;
    }

    .aviso {
      margin-top: 23px;
      font-size: 12px;
      line-height: 1.6;
      color: #68756e;
    }
  </style>
</head>

<body>
  <main>
    <img src="./icon.svg" alt="Logo Solicitudes de Izaje">

    <h1>Solicitudes de Izaje</h1>
    <p class="subtitulo">Bodega de Izaje · Minera El Abra</p>

    <a href="https://script.google.com/a/macros/userena.cl/s/AKfycbxTfo3Q3u9XWCfqQteWx87MEw71d8qdI01vySjn6PcFIvRtV9qP5JfB8WgC_WZ2yDr_/exec">
      INGRESAR AL FORMULARIO
    </a>

    <p class="aviso">
      Completa tu solicitud desde el celular.<br>
      El envío no garantiza disponibilidad ni autoriza el uso de los elementos.
    </p>
  </main>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js")
          .catch(error => console.error("Error al registrar:", error));
      });
    }
  </script>
</body>
</html>
